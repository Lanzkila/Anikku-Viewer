syntax = "proto2";

/*
 * Kirin Anikku Backup Viewer schema.
 * Based on the protobuf field numbers used by current Anikku Backup models.
 * v0.1.0 intentionally focuses on library/video data. Unknown protobuf fields
 * (for example preference payload internals and embedded extension APK bytes)
 * are safely skipped by protobuf decoders.
 */

message Backup {
  optional bool isLegacy = 500 [default = false];
  repeated BackupManga backupManga = 501;
  repeated BackupCategory backupCategories = 502;
  repeated BackupSource backupSources = 503;
  repeated BackupSavedSearch backupSavedSearches = 600;
  repeated BackupFeed backupFeeds = 610;
}

message LegacyBackup {
  repeated BackupManga backupManga = 3;
  repeated BackupCategory backupCategories = 4;
  repeated BackupSource backupSources = 103;
  repeated BackupSavedSearch backupSavedSearches = 600;
  repeated BackupFeed backupFeeds = 610;
}

message BackupCategory {
  optional string name = 1;
  optional int64 order = 2;
  optional int64 id = 3;
  optional int64 flags = 100;
  optional bool hidden = 900;
}

message BackupSource {
  optional string name = 1;
  optional int64 sourceId = 2;
}

message BackupHistory {
  optional string url = 1;
  optional int64 lastRead = 2;
  optional int64 readDuration = 3;
}

message BackupTracking {
  optional int32 syncId = 1;
  optional int64 libraryId = 2;
  optional int32 mediaIdInt = 3;
  optional string trackingUrl = 4;
  optional string title = 5;
  optional float lastEpisodeSeen = 6;
  optional int32 totalEpisodes = 7;
  optional float score = 8;
  optional int32 status = 9;
  optional int64 startedWatchingDate = 10;
  optional int64 finishedWatchingDate = 11;
  optional bool private = 12;
  optional int64 mediaId = 100;
}

message BackupChapter {
  optional string url = 1;
  optional string name = 2;
  optional string scanlator = 3;
  optional bool seen = 4;
  optional bool bookmark = 5;
  optional int64 lastSecondSeen = 6;
  optional int64 dateFetch = 7;
  optional int64 dateUpload = 8;
  optional float episodeNumber = 9;
  optional int64 sourceOrder = 10;
  optional int64 lastModifiedAt = 11;
  optional int64 version = 12;
  optional bool fillermarkLegacy = 15;
  optional int64 totalSeconds = 16;

  // Aniyomi / Anikku video fields
  optional bool fillermark = 501;
  optional string summary = 502;
  optional string previewUrl = 503;
}

message BackupManga {
  optional int64 source = 1;
  optional string url = 2;
  optional string title = 3;
  optional string artist = 4;
  optional string author = 5;
  optional string description = 6;
  repeated string genre = 7;
  optional int32 status = 8;
  optional string thumbnailUrl = 9;
  optional int64 dateAdded = 13;
  repeated BackupChapter episodes = 16;
  repeated int64 categories = 17;
  repeated BackupTracking tracking = 18;
  optional bool favorite = 100;
  optional int32 episodeFlags = 101;
  optional int32 viewer_flags = 103;
  repeated BackupHistory history = 104;
  optional int32 updateStrategy = 105;
  optional int64 lastModifiedAt = 106;
  optional int64 favoriteModifiedAt = 107;
  repeated string excludedScanlators = 108;
  optional int64 version = 109;
  optional string notes = 110;
  optional bool initialized = 111;

  // Anime / video specific values
  optional string backgroundUrl = 500;
  optional int64 parentId = 502;
  optional int64 id = 503;
  optional int64 seasonFlags = 504;
  optional double seasonNumber = 505;
  optional int64 seasonSourceOrder = 506;
  // 0 = Seasons, 1 = Episodes in current Anikku source API enum order
  optional int32 fetchType = 507;

  // Common custom metadata fields
  optional int32 customStatus = 602;
  optional string customThumbnailUrl = 603;
  optional string customTitle = 800;
  optional string customArtist = 801;
  optional string customAuthor = 802;
  optional string customDescription = 804;
  repeated string customGenre = 805;
}

message BackupSavedSearch {
  optional string name = 1;
  optional string query = 2;
  optional string filterList = 3;
  optional int64 source = 4;
}

message BackupFeed {
  optional int64 source = 1;
  optional bool global = 2;
  optional BackupSavedSearch savedSearch = 9;
}
